<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <div class="flex flex-col items-center">
            <!-- Logo -->
            <img class="h-24 w-auto object-contain mb-6" src="/static/logo.png" alt="Company Logo">
            <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900">
                Batch Details
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Verified Manufacturing Data
            </p>
        </div>
        
        <div class="mt-8 space-y-6">
            <div class="rounded-md bg-blue-50 p-4 border border-blue-100">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <!-- Heroicon name: solid/information-circle -->
                        <svg class="h-5 w-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3 flex-1 md:flex md:justify-between">
                        <p class="text-sm text-blue-700 font-medium">
                            Status: Production Complete
                        </p>
                    </div>
                </div>
            </div>

            <dl class="divide-y divide-gray-200">
                {% for key, value in data.items() %}
                <div class="py-4 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4">
                    <dt class="text-sm font-medium text-gray-500 capitalize">
                        {{ key.replace('_', ' ') }}
                    </dt>
                    <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2 font-semibold">
                        {{ value }}
                    </dd>
                </div>
                {% endfor %}
            </dl>
        </div>
        
        <div class="mt-6 text-center">
             <p class="text-xs text-gray-400">
                Generated by QR Code API
            </p>
        </div>
    </div>
</body>
</html>
